<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">HonkTAK interface overview</title>
  <desc id="desc">An ATAK-style map with goose camera markers and coverage wedges beside the HonkTAK camera mapping controls.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252c33"/>
      <stop offset="1" stop-color="#171c21"/>
    </linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263039"/>
      <stop offset="1" stop-color="#12181d"/>
    </linearGradient>
    <linearGradient id="cyanButton" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#136b7b"/>
      <stop offset="1" stop-color="#0b4858"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8796a3" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <symbol id="goose" viewBox="0 0 48 48">
      <path fill="#f4f1de" d="M8 29C8 20 18 16 27 20c4 2 7 4 12 3-2 9-10 14-20 13-7 0-11-3-11-7Z"/>
      <path fill="#f4f1de" d="M30 22c-1-6 0-12 4-15 4-1 7 2 6 6-2 3-4 6-3 11Z"/>
      <path fill="#e9c46a" d="m39 11 8 3-8 2Z"/>
      <circle cx="36" cy="10" r="1.2" fill="#222"/>
      <path d="m15 36-2 7m12-7 2 7" stroke="#1f252a" stroke-width="2" fill="none"/>
    </symbol>
  </defs>

  <rect width="1200" height="680" rx="18" fill="#0d1115"/>
  <rect x="18" y="18" width="1164" height="644" rx="14" fill="#141a1f" stroke="#44515b"/>

  <!-- Map -->
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="736" height="612" rx="10" fill="url(#map)"/>
    <rect x="34" y="34" width="736" height="612" rx="10" fill="url(#grid)"/>
    <path d="M58 548C165 490 203 390 315 359s187-7 268-80 108-155 167-182" fill="none" stroke="#5f6971" stroke-width="24" opacity=".42"/>
    <path d="M58 548C165 490 203 390 315 359s187-7 268-80 108-155 167-182" fill="none" stroke="#b5bec5" stroke-width="2" opacity=".5"/>
    <path d="M92 95c101 45 172 114 224 207s122 181 232 250" fill="none" stroke="#53616b" stroke-width="13" opacity=".4"/>
    <path d="M111 611c72-83 165-126 258-128 102-2 181 37 353 104" fill="none" stroke="#52616b" stroke-width="11" opacity=".36"/>
    <path d="M85 170h165v95H85zm413 264h196v126H498zM354 78h185v116H354z" fill="#21292f" stroke="#3f4b54"/>
    <path d="M107 190h53v50h-53zm69 0h52v50h-52zm346 269h62v74h-62zm80 0h68v74h-68zM376 101h58v70h-58zm78 0h62v70h-62z" fill="#2d373e"/>
    <path d="M0 0 118-76A140 140 0 0 1 108 13Z" transform="translate(360 365) rotate(-18)" fill="#ffa000" fill-opacity=".2" stroke="#ffc247" stroke-opacity=".82"/>
    <circle cx="360" cy="365" r="14" fill="#20170a" stroke="#ffc247" stroke-width="2" filter="url(#glow)"/>
    <use href="#goose" x="339" y="342" width="42" height="42" filter="url(#shadow)"/>
    <path d="M0 0 92-62A112 112 0 0 1 96 25Z" transform="translate(604 220) rotate(18)" fill="#ffa000" fill-opacity=".18" stroke="#ffc247" stroke-opacity=".7"/>
    <use href="#goose" x="584" y="197" width="40" height="40"/>
    <g transform="translate(178 424)">
      <use href="#goose" x="-20" y="-23" width="40" height="40" opacity=".62"/>
      <path d="M-17-18 17 16M17-18-17 16" stroke="#ff5151" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="360" cy="365" r="4" fill="#ffc247"/>
    <text x="388" y="357" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Unidentified Waterfowl</text>
    <text x="388" y="378" fill="#91a5b3" font-family="Arial, sans-serif" font-size="12">PTZ · 067° · high confidence</text>
    <text x="198" y="426" fill="#ff8b8b" font-family="Arial, sans-serif" font-size="13" font-weight="700">DEFEATED · LOCAL ONLY</text>
    <rect x="52" y="50" width="250" height="44" rx="7" fill="#11171c" fill-opacity=".92" stroke="#51606a"/>
    <text x="71" y="77" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">HonkTAK map overlay</text>
    <text x="52" y="627" fill="#9aa7b0" font-family="Arial, sans-serif" font-size="11">Camera data © OpenStreetMap contributors</text>
    <g transform="translate(718 590)">
      <circle r="28" fill="#11171c" stroke="#51606a"/>
      <path d="M0-17V17M-17 0H17" stroke="#d7e1e7" stroke-width="2"/>
      <circle r="5" fill="#51e7ff"/>
    </g>
  </g>

  <!-- Control panel -->
  <g filter="url(#shadow)">
    <rect x="790" y="34" width="376" height="612" rx="10" fill="url(#panel)" stroke="#4e5a64"/>
    <rect x="790" y="34" width="376" height="58" rx="10" fill="#202830"/>
    <text x="814" y="70" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="700">HonkTAK</text>
    <text x="1138" y="68" text-anchor="end" fill="#50ddf8" font-family="Arial, sans-serif" font-size="12" font-weight="700">CAMERA GOOSE MAPPER</text>

    <text x="814" y="120" fill="#d5dde3" font-family="Arial, sans-serif" font-size="13">Map observed cameras or load public ALPR</text>
    <text x="814" y="138" fill="#d5dde3" font-family="Arial, sans-serif" font-size="13">locations for the current viewport.</text>

    <rect x="814" y="157" width="328" height="48" rx="6" fill="#9e302d" stroke="#dd6b66"/>
    <text x="978" y="187" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">REPORT HONK — PLACE ON MAP</text>
    <rect x="814" y="214" width="328" height="43" rx="6" fill="url(#cyanButton)" stroke="#3fb8cb"/>
    <text x="978" y="241" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">LOAD CAMERAS IN VIEW</text>

    <line x1="814" y1="278" x2="1142" y2="278" stroke="#43515b"/>
    <text x="814" y="305" fill="#50ddf8" font-family="Arial, sans-serif" font-size="12" font-weight="700">PENDING OBSERVATION</text>
    <text x="814" y="329" fill="#fff" font-family="Arial, sans-serif" font-size="13">Camera class</text>
    <rect x="946" y="311" width="196" height="28" rx="4" fill="#10161a" stroke="#56636c"/>
    <text x="960" y="330" fill="#dce4e9" font-family="Arial, sans-serif" font-size="12">license_plate_reader</text>
    <text x="814" y="365" fill="#fff" font-family="Arial, sans-serif" font-size="13">Direction</text>
    <text x="946" y="365" fill="#dce4e9" font-family="Arial, sans-serif" font-size="13">067° · 184 m · 45° FOV</text>
    <text x="814" y="397" fill="#fff" font-family="Arial, sans-serif" font-size="13">Confidence</text>
    <text x="946" y="397" fill="#dce4e9" font-family="Arial, sans-serif" font-size="13">high</text>
    <text x="814" y="429" fill="#fff" font-family="Arial, sans-serif" font-size="13">Status</text>
    <text x="946" y="429" fill="#dce4e9" font-family="Arial, sans-serif" font-size="13">active</text>
    <rect x="814" y="448" width="328" height="42" rx="5" fill="#11171c" stroke="#56636c"/>
    <text x="828" y="474" fill="#84929c" font-family="Arial, sans-serif" font-size="12">Short notes (160 characters max)</text>
    <rect x="814" y="507" width="16" height="16" rx="2" fill="#11171c" stroke="#7d8a93"/>
    <text x="840" y="520" fill="#dce4e9" font-family="Arial, sans-serif" font-size="13">Temporary marker (optional)</text>

    <rect x="814" y="544" width="155" height="44" rx="6" fill="#275d42" stroke="#52a879"/>
    <text x="891" y="571" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">SAVE LOCALLY</text>
    <rect x="987" y="544" width="155" height="44" rx="6" fill="#075d70" stroke="#40bfd6"/>
    <text x="1064" y="563" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">SHARE TO TEAM</text>
    <text x="1064" y="578" text-anchor="middle" fill="#b9edf5" font-family="Arial, sans-serif" font-size="9">EXPLICIT ONE-SHOT SEND</text>
    <text x="814" y="617" fill="#92a0aa" font-family="Arial, sans-serif" font-size="11">Nothing transmits until SHARE TO TEAM is pressed.</text>
  </g>
</svg>
