apply plugin: 'com.android.application'
apply plugin: 'atak-takdev-plugin'

def localBuildProperties = new Properties()
def localBuildPropertiesFile = project.rootProject.file('local.properties')
if (localBuildPropertiesFile.isFile()) localBuildPropertiesFile.withReader { localBuildProperties.load(it) }
def hasDebugSigningKey = localBuildProperties.getProperty('takDebugKeyFile') != null
def apkTaskRequested = gradle.startParameter.taskNames.any {
    def taskName = it.tokenize(':').last().toLowerCase()
    taskName.startsWith('assemble') || taskName.startsWith('bundle') ||
        taskName.startsWith('package') || taskName.startsWith('install')
}
if (apkTaskRequested && !hasDebugSigningKey) {
    throw new GradleException('No local debug signing key configured; no key is distributed with HonkTAK.')
}

android {
    compileSdkVersion 26
    buildToolsVersion "30.0.2"
    lintOptions { checkReleaseBuilds true; abortOnError true }
    signingConfigs {
        if (hasDebugSigningKey) {
            debug {
                storeFile file(localBuildProperties.getProperty('takDebugKeyFile'))
                storePassword localBuildProperties.getProperty('takDebugKeyFilePassword')
                keyAlias localBuildProperties.getProperty('takDebugKeyAlias')
                keyPassword localBuildProperties.getProperty('takDebugKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
            if (hasDebugSigningKey) signingConfig signingConfigs.debug
        }
    }
    flavorDimensions "application"
    productFlavors { civ { dimension "application"; manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".CIV"] } }
    sourceSets {
        main {
            setProperty('archivesBaseName', 'ATAK-Plugin-' + rootProject.name + '-' + PLUGIN_VERSION + '-' + getVersionName() + '-' + ATAK_VERSION)
            defaultConfig.versionCode = getVersionCode()
            defaultConfig.versionName = PLUGIN_VERSION + ' (' + getVersionName() + ') - [' + ATAK_VERSION + ']'
        }
        debug.setRoot('build-types/debug')
    }
    defaultConfig { minSdkVersion 21 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
